<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rifath Alom - Portfolio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding-top: 50px; /* manually push content down */
        }
        
        .main-box {
            background-color: #1e1e1e;
            width: 380px;
            margin: 0 auto; /* centers the box horizontally */
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.4);
        }

        h1 {
            color: #00adb5; /* nice clean accent color */
            margin-bottom: 5px;
        }

        .subtitle {
            color: #aaaaaa;
            font-size: 16px;
            margin-top: 0;
            margin-bottom: 30px;
        }

        /* Styling for the buttons */
        .btn {
            display: block;
            background-color: #2d2d2d;
            color: #ffffff;
            padding: 12px;
            margin-bottom: 12px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }

        /* Simple hover effect */
        .btn:hover {
            background-color: #00adb5;
            color: #ffffff;
        }

        .footer-text {
            margin-top: 25px;
            font-size: 13px;
            color: #777777;
        }
    </style>
</head>
<body>

    <div class="main-box">
        <h1>Rifath Alom</h1>
        <p class="subtitle">AI Automation Specialist & Developer</p>
        
        <!-- Links -->
        <a href="#" class="btn">🚀 My AI Workflows</a>
        <a href="#" class="btn">💻 GitHub Portfolio</a>
        <a href="#" class="btn">📩 Contact Me</a>
        
        <p class="footer-text">Built with HTML & CSS</p>
    </div>

</body>
</html>
