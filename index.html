<!DOCTYPE html>
<html lang="en">
<head>

    <style>
        body {

            background-color: #121212;

        .main-box {
            background-color: #1e1e1e;
            width: 360px;

        }

            color: #aaaaaa;
            font-size: 15px;

        }

        /* Styling for the link buttons */
        .btn {
            display: block;
            background-color: #2d2d2d;
            color: #ffffff;
            padding: 12px;
            margin-bottom: 12px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }

        /* Simple color change on hover */
        .btn:hover {
            background-color: #00adb5;
        }

        .footer-text {
            margin-top: 25px;

            color: #666666;
